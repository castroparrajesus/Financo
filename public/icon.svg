<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="financo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#0A1D3B" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Base background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#financo-bg)" />
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#334E68" stroke-width="6" opacity="0.4" />

  <!-- Balance Beam / Scale Bar in Emerald -->
  <g transform="translate(256, 256)">
    <!-- Shield / Balance Base Contour -->
    <path d="M-130,-120 L130,-120 C140,-120 148,-110 144,-100 L120,60 C110,130 0,165 0,165 C0,165 -110,130 -120,60 L-144,-100 C-148,-110 -140,-120 -130,-120 Z" 
          fill="#13386E" stroke="#2563EB" stroke-width="8" opacity="0.6" />

    <!-- Stylized F + Balance Crossbar -->
    <!-- Top Bar (Bank Extract) -->
    <rect x="-95" y="-75" width="190" height="26" rx="13" fill="#FFFFFF" />
    
    <!-- Middle Bar (Ledger Match) -->
    <rect x="-95" y="-20" width="140" height="24" rx="12" fill="url(#emerald-glow)" />

    <!-- Vertical Stem -->
    <rect x="-95" y="-75" width="28" height="180" rx="14" fill="#FFFFFF" />

    <!-- Conciliated Balance Checkmark Icon (bottom right of shield) -->
    <circle cx="65" cy="45" r="46" fill="url(#emerald-glow)" stroke="#0F2C59" stroke-width="8" />
    <path d="M48 45 L60 57 L84 33" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
