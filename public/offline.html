<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financo — Sin Conexión</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root {
      --bg: #0F2C59;
      --card: #1A365D;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --emerald: #10B981;
      --border: #334E68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: var(--emerald);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.925rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary {
      background: var(--emerald);
      color: #0F2C59;
    }
    .btn-primary:hover {
      background: #059669;
      color: #FFFFFF;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      color: #FBBF24;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>
      Estás navegando en modo sin conexión. Las cédulas de conciliación previamente abiertas en este dispositivo están disponibles en la caché local segura.
    </p>
    <div class="actions">
      <a href="/dashboard/conciliaciones" class="btn btn-primary">
        Ver conciliaciones en caché
      </a>
      <button onclick="window.location.reload()" class="btn btn-secondary">
        Reintentar conexión
      </button>
    </div>
    <div class="badge">
      Financo PWA • Almacenamiento local cifrado
    </div>
  </div>
</body>
</html>
